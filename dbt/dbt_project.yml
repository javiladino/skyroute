name: skyroute
version: "0.0.1"
config-version: 2
profile: skyroute

model-paths: ["models"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

# Spike 0c: la fecha logica llega siempre por --vars '{run_date: YYYY-MM-DD}' (Idempotency, nunca now()).
# El valor por defecto es un centinela solo para que `dbt parse` y `dbt ls` funcionen sin vars.
vars:
  run_date: "1970-01-01"

models:
  skyroute:
    spike:
      +materialized: view
