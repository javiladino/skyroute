# Checks WAP de silver.bookings_current (motor: spark/lib/checks.py). Se evaluan sobre la rama run_<D>.
checks:
  - {type: not_null, column: booking_id}
  - {type: not_null, column: history_id}
  - {type: not_null, column: changed_at}
  - {type: not_null, column: amount}
  - {type: not_null, column: origin}
  - {type: not_null, column: destination}
  - {type: not_null, column: travel_date}
  - {type: expression, name: travel_after_created, sql: "travel_date >= to_date(created_at)"}
  - {type: unique, columns: [booking_id]}
  - {type: accepted_values, column: status, values: [pending, confirmed, cancelled]}
