name: spark-tests

on:
  pull_request:
    paths:
      - "spark/**"
      - "generators/**"
      - "ruff.toml"
      - "requirements*"
      - ".github/workflows/spark-tests.yml"
  push:
    branches: [main]
    paths:
      - "spark/**"
      - "generators/**"
      - "ruff.toml"
      - "requirements*"
      - ".github/workflows/spark-tests.yml"

permissions:
  contents: read

concurrency:
  group: spark-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: ruff y pytest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      # Java 17: el de Glue 5.0 (spark/requirements.txt). Los tests usan Spark local con
      # catalogo hadoop; sin credenciales de AWS.
      - name: Setup Java 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt -r spark/requirements.txt

      - name: ruff
        run: ruff check .

      - name: pytest
        run: pytest generators spark -q
