name: terraform-apply

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: terraform-apply
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-3
  TF_VERSION: "1.17.1"

jobs:
  apply-dev:
    name: apply-dev
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: dev
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: infra/terraform/envs/dev
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials (ci-apply-dev)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::437266392155:role/ci-apply-dev
          aws-region: eu-west-3

      - name: Terraform init
        run: terraform init -input=false -no-color

      - name: Terraform apply
        run: terraform apply -input=false -no-color -auto-approve -lock-timeout=60s

  apply-prod:
    name: apply-prod
    needs: apply-dev
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: prod
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: infra/terraform/envs/prod
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials (ci-apply-prod)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::437266392155:role/ci-apply-prod
          aws-region: eu-west-3

      - name: Terraform init
        run: terraform init -input=false -no-color

      - name: Terraform apply
        run: terraform apply -input=false -no-color -auto-approve -lock-timeout=60s
