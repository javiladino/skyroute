name: terraform-plan

on:
  pull_request:

permissions: {}

concurrency:
  group: terraform-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  AWS_REGION: eu-west-3
  TF_VERSION: "1.17.1"

jobs:
  plan:
    name: plan-${{ matrix.env }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        env: [dev, prod]
    defaults:
      run:
        working-directory: infra/terraform/envs/${{ matrix.env }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform fmt
        run: terraform fmt -check -recursive -no-color

      - name: Configure AWS credentials (ci-plan)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::437266392155:role/ci-plan
          aws-region: eu-west-3

      - name: Terraform init
        run: terraform init -input=false -no-color

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Terraform plan
        id: plan
        run: |
          set +e
          terraform plan -input=false -no-color -lock-timeout=60s > "$RUNNER_TEMP/plan.txt" 2>&1
          code=$?
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish plan
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PLAN_FILE: ${{ runner.temp }}/plan.txt
          PLAN_ENV: ${{ matrix.env }}
          PLAN_EXIT: ${{ steps.plan.outputs.exitcode }}
        with:
          script: |
            const fs = require('fs');
            const env = process.env.PLAN_ENV;
            const exit = process.env.PLAN_EXIT;
            const marker = `<!-- terraform-plan-${env} -->`;
            const plan = fs.readFileSync(process.env.PLAN_FILE, 'utf8');
            const status = exit === '0' ? 'OK' : 'FALLO';
            const header = `${marker}\n### Terraform plan: ${env} (${status})\n\n`;
            const body = header + '```\n' + plan + '\n```\n';
            if (body.length > 65000) {
              await core.summary
                .addRaw(`### Terraform plan: ${env} (${status})\n\nSalida demasiado larga para un comentario.\n\n`)
                .addCodeBlock(plan, 'text')
                .write();
              const short = header + 'La salida supera el límite de comentario; ver el job summary del run.\n';
              await upsert(short);
            } else {
              await upsert(body);
            }
            async function upsert(text) {
              const { owner, repo } = context.repo;
              const issue_number = context.payload.pull_request.number;
              const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
              const prev = comments.find(c => c.user.type === 'Bot' && c.body.startsWith(marker));
              if (prev) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: prev.id, body: text });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number, body: text });
              }
            }

      - name: Fail if plan failed
        if: steps.plan.outputs.exitcode != '0'
        run: exit 1

  static-checks:
    name: static-checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install checkov
        run: pip install "checkov==3.4.5"

      - name: checkov
        run: checkov -d infra/terraform --framework terraform --quiet --compact

      - name: Setup tflint
        uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.65.0

      - name: tflint (envs/dev, envs/prod)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          for m in envs/dev envs/prod; do
            tflint --init --config="$GITHUB_WORKSPACE/infra/terraform/.tflint.hcl"
            tflint --config="$GITHUB_WORKSPACE/infra/terraform/.tflint.hcl" --chdir="infra/terraform/$m"
          done
